# Production stack: Postgres + the single-container app + Caddy for automatic TLS.
#
#   cp .env.production.example .env
#   # edit .env — at minimum APP_DOMAIN, POSTGRES_PASSWORD and JWT_SECRET
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy obtains and renews a Let's Encrypt certificate for APP_DOMAIN on its own,
# so there is no certbot step and nothing to remember to rotate.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the app container needs to reach it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadgen} -d ${POSTGRES_DB:-leadgen}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadgen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leadgen}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Served over HTTPS by Caddy, so the session cookie gets the Secure flag.
      COOKIE_SECURE: "true"
      # Dashboard and API share an origin here, so CORS only needs the app's own URL.
      CORS_ORIGIN: https://${APP_DOMAIN}
      SERVE_WEB_DIR: /app/web/dist
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      DELIVERY_TIMEOUT_MS: ${DELIVERY_TIMEOUT_MS:-8000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
      DELIVERY_BACKOFF_MS: ${DELIVERY_BACKOFF_MS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
