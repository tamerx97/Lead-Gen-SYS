server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed bundles never change; index.html must not be cached or users keep
  # booting a stale bundle against a newer API.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Everything the API owns is proxied through, so the browser sees one origin
  # and the session cookie needs no cross-site configuration.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://api:4000/health;
    access_log off;
  }

  # Client-side routes (/leads, /playground, …) fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
