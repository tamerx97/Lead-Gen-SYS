name: CI

# Runs the test suite and — crucially — actually builds and boots the Docker
# image. The image build could not be exercised where this project was authored,
# so this workflow is what proves it works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadgen
          POSTGRES_PASSWORD: leadgen
          POSTGRES_DB: leadgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadgen -d leadgen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://leadgen:leadgen@localhost:5432/leadgen?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm --workspace api run migrate

      - name: Typecheck (api)
        run: npx tsc --noEmit -p api/tsconfig.json

      - name: Typecheck (web)
        run: npm --workspace web run typecheck

      - name: Unit + integration tests
        run: npm --workspace api run test

      - name: Build both workspaces
        run: npm run build

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadgen
          POSTGRES_PASSWORD: leadgen
          POSTGRES_DB: leadgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadgen -d leadgen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Build the single-container image
        run: docker build -t leadgen:ci .

      - name: Build the split-tier images
        run: |
          docker build -f api/Dockerfile -t leadgen-api:ci .
          docker build -f web/Dockerfile -t leadgen-web:ci .

      - name: Boot the image and prove it serves
        run: |
          set -euo pipefail

          docker run -d --name leadgen-test --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL='postgresql://leadgen:leadgen@localhost:5432/leadgen?schema=public' \
            -e JWT_SECRET='ci-only-secret-not-used-in-production-0123456789' \
            leadgen:ci

          # Migrations run on boot, so give the container a moment to finish.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health > /dev/null 2>&1; then
              echo "container is healthy after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::container never became healthy"
              docker logs leadgen-test
              exit 1
            fi
            sleep 1
          done

          echo "--- /health ---"
          curl -fsS http://localhost:4000/health

          echo "--- dashboard is served by the same process ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/)" = "200"

          echo "--- client-side routes fall back to the app shell ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/playground)" = "200"

          echo "--- unknown API routes still 404 as JSON, not as the app shell ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/nope)" = "404"

          echo "--- the dev mock buyer must NOT exist in a production image ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4000/mock/buyer/x)" = "404"

          echo "--- bootstrap an admin the way a real deployment does ---"
          docker exec leadgen-test node api/dist/src/scripts/createAdmin.js \
            ci@example.com 'a-long-enough-passphrase'

          echo "--- and that admin can sign in ---"
          curl -fsS -X POST http://localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"a-long-enough-passphrase"}' \
            | grep -q 'ci@example.com'

          echo "ALL CONTAINER CHECKS PASSED"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs leadgen-test || true

      - name: Validate the compose files
        env:
          APP_DOMAIN: example.com
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ci-only-secret-not-used-in-production-0123456789
        run: |
          docker compose config > /dev/null
          docker compose -f docker-compose.prod.yml config > /dev/null
          echo "compose files valid"

  installer:
    name: install.sh works on a clean machine
    runs-on: ubuntu-latest
    # This is the exact path a real operator takes, so it is worth running for
    # real rather than reasoning about. The runner is a clean Ubuntu box with
    # Docker present, which is what the script targets.

    steps:
      - uses: actions/checkout@v4

      - name: Run the installer end to end
        run: |
          set -euo pipefail

          # No domain, so the script takes its plain-HTTP fallback and serves on
          # the machine's IP — the same path someone gets before they own a domain.
          sudo REPO_URL="${{ github.server_url }}/${{ github.repository }}.git" \
               REPO_REF="${{ github.event.pull_request.head.sha || github.sha }}" \
               bash install.sh "" "ci@example.com" 2>&1 | tee /tmp/install.log

          # The installer must not report success on a failure.
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/install.log | grep -q "YOUR LEAD SYSTEM IS LIVE"

          # The password must be readable from piped output — someone saving the
          # installer's output to a file has to be able to read their password.
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/install.log \
            | grep -qP 'Password:\s+[A-Za-z0-9]{12,}'

      - name: The printed credentials must actually work
        run: |
          set -euo pipefail

          # Take the password out of the installer's own output, the way a user
          # reads it off their screen.
          PASSWORD="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/install.log \
                      | grep -oP 'Password:\s+\K[A-Za-z0-9]+' | head -1)"
          test -n "$PASSWORD" || { echo "::error::installer printed no password"; exit 1; }
          echo "installer printed a ${#PASSWORD}-character password"

          echo "--- the site is reachable on port 80 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "200"

          echo "--- health check passes through the proxy ---"
          curl -fsS http://localhost/health

          echo "--- those credentials sign in ---"
          curl -fsS -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.com\",\"password\":\"$PASSWORD\"}" \
            | grep -q 'ci@example.com'

          echo "--- and the system starts EMPTY, with none of the dev seed data ---"
          COOKIE=/tmp/cookie.txt
          curl -fsS -c "$COOKIE" -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.com\",\"password\":\"$PASSWORD\"}" > /dev/null
          VERTICALS="$(curl -fsS -b "$COOKIE" http://localhost/api/verticals)"
          test "$VERTICALS" = "[]" || {
            echo "::error::a fresh install must have no verticals, got: $VERTICALS"; exit 1; }
          SOURCES="$(curl -fsS -b "$COOKIE" http://localhost/api/sources)"
          test "$SOURCES" = "[]" || {
            echo "::error::a fresh install must ship no API keys, got: $SOURCES"; exit 1; }

          echo "INSTALLER VERIFIED"

      - name: Re-running the installer must be safe
        run: |
          set -euo pipefail
          PASSWORD="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/install.log \
                      | grep -oP 'Password:\s+\K[A-Za-z0-9]+' | head -1)"

          sudo REPO_URL="${{ github.server_url }}/${{ github.repository }}.git" \
               REPO_REF="${{ github.event.pull_request.head.sha || github.sha }}" \
               bash install.sh "" "ci@example.com" 2>&1 | tee /tmp/install2.log

          echo "--- it must keep the existing password, not silently reset it ---"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/install2.log \
            | grep -q "unchanged from your previous install"

          echo "--- and the original password still works afterwards ---"
          curl -fsS -X POST http://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.com\",\"password\":\"$PASSWORD\"}" \
            | grep -q 'ci@example.com'

          echo "RE-RUN VERIFIED"

      - name: Logs (on failure)
        if: failure()
        run: |
          sudo cat /tmp/install.log || true
          cd /opt/leadgen && sudo docker compose -f docker-compose.prod.yml logs --tail 60 || true
