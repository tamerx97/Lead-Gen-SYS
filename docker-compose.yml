# Sovereign Lead Distribution CRM — local infrastructure.
# Runs only PostgreSQL; the API and web app run on the host with `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    container_name: leadgen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen
      POSTGRES_DB: leadgen
    ports:
      - "5432:5432"
    volumes:
      - leadgen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  leadgen-pgdata:
